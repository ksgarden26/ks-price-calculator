name = "ks-reviews-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Replace this ID with the ID printed by: npx wrangler d1 create ks-reviews
[[d1_databases]]
binding = "DB"
database_name = "ks-reviews"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# Set these after verifying the exact live admin-page URL.
[vars]
NOTIFY_TO_EMAIL = "info@ksgardenservices.co.uk"
REVIEW_FROM_EMAIL = "KS Garden Services <reviews@ksgardenservices.co.uk>"
REVIEW_ADMIN_URL = "https://ksgardenservices.co.uk/review-admin.html"

# Enable after creating the R2 bucket named ks-garden-photos.
# [[r2_buckets]]
# binding = "PHOTO_BUCKET"
# bucket_name = "ks-garden-photos"

# Uncomment to route public reviews, gallery, news and private admin API
# through this same worker, without replacing existing website pages:
# [[routes]]
# pattern = "ksgardenservices.co.uk/api/*"
# zone_name = "ksgardenservices.co.uk"
# [[routes]]
# pattern = "www.ksgardenservices.co.uk/api/*"
# zone_name = "ksgardenservices.co.uk"

# Sunday 08:00 UTC (08:00 GMT / 09:00 BST). Runs are safe until fully configured.
[triggers]
crons = ["0 8 * * SUN"]

# Newsletter needs Cloudflare secrets BREVO_API_KEY and BREVO_DOI_TEMPLATE_ID,
# plus the Brevo list id, verified sender, and optional news JSON URL below.
# Keep automatic sending off until setup and a successful test.
# BREVO_API_KEY must be set using `wrangler secret put BREVO_API_KEY`.
# Append to [vars] above when ready:
# BREVO_LIST_ID = "YOUR_LIST_ID"
# BREVO_DOI_TEMPLATE_ID = "YOUR_TEMPLATE_ID"
# BREVO_SENDER_EMAIL = "info@ksgardenservices.co.uk"
# NEWSLETTER_AUTO_SEND = "false"
# NEWSLETTER_NEWS_JSON_URL = "https://ksgardenservices.co.uk/news-data.json"
